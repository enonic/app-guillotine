plugins {
    id 'com.enonic.xp.app'
}

if (findProperty('fixtureBuildDir')) {
    layout.buildDirectory = file(findProperty('fixtureBuildDir'))
}

dependencies {
    implementation xplibs.api.core
    include xplibs.context
}

repositories {
    mavenLocal()
    mavenCentral()
    xp.enonicRepo( 'dev' )
}
