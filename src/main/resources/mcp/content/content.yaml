kind: MCP
allow:
  - role:system.authenticated
tools:
  - name: list-projects
    title: List content projects
    description: >-
      Call this first. Returns who the caller is, the content projects they have a role in plus the configured default project
      (with parent layer, language and number of content items) and the project and branch other tools use when none is given.
      Anonymous callers read only published content (master).
    inputSchema:
      type: object
      properties: {}
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        caller:
          type: object
          properties:
            anonymous:
              type: boolean
            key:
              type: string
            displayName:
              type: string
          required: [anonymous]
          additionalProperties: false
        defaultProject:
          type: string
        defaultBranch:
          type: string
          enum: [draft, master]
        projects:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              displayName:
                type: string
              description:
                type: string
              language:
                type: string
              parent:
                type: string
                description: Parent project this layer inherits content from.
              itemCount:
                type: integer
                description: Content items the caller can read on defaultBranch.
            required: [name, displayName, itemCount]
            additionalProperties: false
        truncated:
          type: boolean
        hint:
          type: string
      required: [projects]
      additionalProperties: false
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
    _meta:
      anthropic/alwaysLoad: true
  - name: list-types
    title: List content types in use
    description: >-
      Content types in use: the content types that have content in a project, most used first, with title, item count and the
      GraphQL type their content has in query results. Call describe-type with a name for its fields and example queries.
    inputSchema:
      type: object
      properties:
        project:
          type: string
          description: Project from list-projects; defaults to defaultProject.
        branch:
          type: string
          enum: [draft, master]
          description: draft (latest, signed-in users with a project role) or master (published); defaults to defaultBranch.
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        project:
          type: string
        branch:
          type: string
          enum: [draft, master]
        total:
          type: integer
          description: Content items the caller can read in the project and branch.
        types:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Content type name, the value of the index field type.
              title:
                type: string
              graphqlType:
                type: string
                description: GraphQL type of this content in query results, for inline fragments (... on Type).
              count:
                type: integer
            required: [name, graphqlType, count]
            additionalProperties: false
        note:
          type: string
        errors:
          type: array
          items:
            type: object
        truncated:
          type: boolean
        hint:
          type: string
      required: [project, branch, total, types]
      additionalProperties: false
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
  - name: describe-type
    title: Describe a content type
    description: >-
      Fields of a content type: compact GraphQL SDL; each data field with its index path for filters, sorts and aggregations, label,
      help text, input type and allowed selector targets; index fields the schema does not show; fields added by other applications;
      and three example queries ready for the query tool. Pass a name from list-types.
    inputSchema:
      type: object
      properties:
        type:
          type: string
          description: >-
            Content type name from list-types (com.example.app:article), its GraphQL type name, or a local name (article) that only
            one content type has.
        project:
          type: string
          description: Project from list-projects; defaults to defaultProject.
        branch:
          type: string
          enum: [draft, master]
          description: draft (latest, signed-in users with a project role) or master (published); defaults to defaultBranch.
      required: [type]
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        project:
          type: string
        branch:
          type: string
          enum: [draft, master]
        contentType:
          type: string
        title:
          type: string
        graphqlType:
          type: string
        count:
          type: integer
          description: Items of this type the caller can read in the project and branch.
        sdl:
          type: string
        fields:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: GraphQL field below data; dots separate set levels.
              path:
                type: string
                description: Index path for filters, sorts and aggregations.
              label:
                type: string
              help:
                type: string
              input:
                type: string
              repeated:
                type: boolean
              required:
                type: boolean
              targets:
                type: array
                items:
                  type: string
                description: Content types, or name patterns, a selector accepts; absent means any.
            required: [name, path, input]
            additionalProperties: false
        appFields:
          type: array
          items:
            type: string
        appFieldsNote:
          type: string
        indexFields:
          type: object
          additionalProperties:
            type: string
        examples:
          type: array
          items:
            type: object
            properties:
              use:
                type: string
              query:
                type: string
            required: [use, query]
            additionalProperties: false
        truncated:
          type: boolean
        hint:
          type: string
      required: [project, branch, contentType, graphqlType, count, sdl, fields, indexFields, examples]
      additionalProperties: false
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
  - name: search
    title: Search content
    description: >-
      Find, filter, sort, count and aggregate content in one project: by text, type, path, field values, what an item links to,
      workflow state, validity or the caller's own edits. Hits give _id, _path, displayName, type, modifiedTime and the data fields
      named in fields; reference values and aggregation buckets of content ids come with the target's displayName and _path. For
      which types exist and how many, use list-types; for a type's field names, describe-type.
    inputSchema:
      type: object
      properties:
        text:
          type: string
          maxLength: 500
          description: >-
            XP full-text query over the display name, the name and any text field. Every plain word must match; "two words"
            matches a phrase, word* a prefix, and -word excludes items that contain the word.
        types:
          type: array
          maxItems: 20
          items:
            type: string
          description: Content type names from list-types; a local name such as article matches it in any application.
        path:
          type: string
          description: This item and everything below it, such as /articles.
        mine:
          type: boolean
          description: Only content the caller modified last; needs a signed-in caller.
        workflow:
          type: string
          enum: [IN_PROGRESS, READY]
          description: IN_PROGRESS is work in progress, found on draft.
        filters:
          type: array
          maxItems: 10
          items:
            type: object
            properties:
              field:
                type: string
              equals:
                type: [string, number, boolean]
              from:
                type: [string, number]
              to:
                type: [string, number]
              exists:
                type: boolean
              references:
                type: string
            additionalProperties: false
          description: >-
            All must match. Each is {field, equals}, {field, from, to} (from inclusive, to exclusive; dates such as 2026-01-31),
            {field, exists} or {references, field?}: content that links to the item with this _id or _path, in field or anywhere.
            field is an index path: data.<name> from describe-type, or modifiedTime, publish.from, publish.to, language, type, or
            valid ({field: valid, equals: false} finds content that fails validation).
        sort:
          type: string
          description: >-
            "field [ASC|DESC]", up to 3 comma-separated; default relevance with text, else modifiedTime DESC.
        aggregate:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              by:
                type: string
              size:
                type: integer
                minimum: 1
                maximum: 100
            required: [by]
            additionalProperties: false
          description: >-
            Counts per value of field by, largest first, size buckets (default 10). count 0 returns buckets only.
        fields:
          type: array
          maxItems: 10
          items:
            type: string
          description: >-
            Data fields to return with each hit, such as [title, author]; publish adds the hit's publish.from, publish.to and
            publish.first.
        count:
          type: integer
          minimum: 0
          maximum: 50
          description: Hits per page; default 10.
        cursor:
          type: string
          description: nextCursor of the previous page; keep the other arguments.
        project:
          type: string
          description: Project from list-projects; defaults to defaultProject.
        branch:
          type: string
          enum: [draft, master]
          description: draft (latest, signed-in users with a project role) or master (published); defaults to defaultBranch.
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        project:
          type: string
        branch:
          type: string
          enum: [draft, master]
        total:
          type: integer
          description: Matching items the caller can read.
        hits:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
              _path:
                type: string
              displayName:
                type: string
              type:
                type: string
              modifiedTime:
                type: string
              workflow:
                type: string
                description: Workflow state when it is not READY.
              publish:
                type: object
                description: The publish dates that are set, when fields asks for publish.
                properties:
                  from:
                    type: string
                  to:
                    type: string
                  first:
                    type: string
                additionalProperties: false
              data:
                type: object
                description: The fields asked for, keyed by name; references as {_id, displayName, _path} or {_id, missing}.
            required: [_id, _path, type]
            additionalProperties: false
        nextCursor:
          type: string
        aggregations:
          type: array
          items:
            type: object
            properties:
              by:
                type: string
              buckets:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: [string, number]
                    count:
                      type: integer
                    displayName:
                      type: string
                    _path:
                      type: string
                    missing:
                      type: boolean
                      description: The content id is missing or not readable.
                  required: [key, count]
                  additionalProperties: false
              note:
                type: string
            required: [by, buckets]
            additionalProperties: false
        note:
          type: string
        errors:
          type: array
          items:
            type: object
        truncated:
          type: boolean
        hint:
          type: string
      required: [project, branch, total, hits]
      additionalProperties: false
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
    _meta:
      anthropic/alwaysLoad: true
  - name: get
    title: Get one content item
    description: >-
      Read one content item by _id or _path: metadata, workflow state and data fields. Rich text comes as plain text plus its
      links; internal link targets and reference fields come with the target's displayName and _path. When a few fields of many items
      are enough, use search with fields; for page components and x-data, use query.
    inputSchema:
      type: object
      properties:
        key:
          type: string
          description: _id, or _path such as /articles/article-01, as search returns them.
        fields:
          type: array
          maxItems: 10
          items:
            type: string
          description: Data fields to return, such as [title, body]; default all that fit.
        project:
          type: string
          description: Project from list-projects; defaults to defaultProject.
        branch:
          type: string
          enum: [draft, master]
          description: draft (latest, signed-in users with a project role) or master (published); defaults to defaultBranch.
      required: [key]
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        project:
          type: string
        branch:
          type: string
          enum: [draft, master]
        _id:
          type: string
        _path:
          type: string
        _name:
          type: string
        displayName:
          type: string
        type:
          type: string
        language:
          type: string
        createdTime:
          type: string
        modifiedTime:
          type: string
        publish:
          type: object
          properties:
            from:
              type: string
            to:
              type: string
            first:
              type: string
          additionalProperties: false
        workflow:
          type: string
        data:
          type: object
          description: >-
            Data fields by name. Rich text is {text, links}; references are {_id, displayName, _path} or {_id, missing} when the
            target is missing or not readable.
        note:
          type: string
        errors:
          type: array
          items:
            type: object
        truncated:
          type: boolean
        hint:
          type: string
      required: [project, branch]
      additionalProperties: false
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
