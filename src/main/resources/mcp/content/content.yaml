kind: MCP
allow:
  - role:system.everyone
tools:
  - name: list-projects
    title: List content projects
    description: >-
      Call this first. Returns who the caller is, the content projects they have a role in plus the configured default project
      (with parent layer, language and number of content items) and the project and branch other tools use when none is given.
      Anonymous callers read only published content (master). When the user has not named a project and there is no
      defaultProject, ask the user which project to use instead of guessing.
    inputSchema:
      type: object
      properties: {}
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        caller:
          type: object
          properties:
            anonymous:
              type: boolean
            key:
              type: string
            displayName:
              type: string
          required: [anonymous]
          additionalProperties: false
        defaultProject:
          type: string
        defaultBranch:
          type: string
          enum: [draft, master]
        projects:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              displayName:
                type: string
              description:
                type: string
              language:
                type: string
              parent:
                type: string
                description: Parent project this layer inherits content from.
              itemCount:
                type: integer
                description: Content items the caller can read on defaultBranch.
            required: [name, displayName, itemCount]
            additionalProperties: false
        note:
          type: string
        truncated:
          type: boolean
        hint:
          type: string
      required: [projects]
      additionalProperties: false
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
    _meta:
      anthropic/alwaysLoad: true
  - name: describe-type
    title: Describe a content type
    description: >-
      Fields of a content type: compact GraphQL SDL; each data field with its index path for filters, sorts and aggregations, label,
      help text, input type and allowed selector targets; index fields the schema does not show; fields added by other applications;
      and three example queries ready for the query tool. Without type: the content types in use, most used first, with their
      graphqlType and count.
    inputSchema:
      type: object
      properties:
        type:
          type: string
          description: >-
            Content type name (com.example.app:article), its GraphQL type name, or a local name (article) that only one content
            type has. Leave it out to list the content types in use with their names.
        project:
          type: string
          description: Project from list-projects; defaults to defaultProject.
        branch:
          type: string
          enum: [draft, master]
          description: draft (latest, signed-in users with a project role) or master (published); defaults to defaultBranch.
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        project:
          type: string
        branch:
          type: string
          enum: [draft, master]
        total:
          type: integer
          description: Without type, content items the caller can read in the project and branch.
        types:
          type: array
          description: Without type, the content types in use, most used first.
          items:
            type: object
            properties:
              name:
                type: string
              title:
                type: string
              graphqlType:
                type: string
              count:
                type: integer
            required: [name, graphqlType, count]
            additionalProperties: false
        note:
          type: string
        errors:
          type: array
          items:
            type: object
        contentType:
          type: string
        title:
          type: string
        graphqlType:
          type: string
        count:
          type: integer
          description: Items of this type the caller can read in the project and branch.
        sdl:
          type: string
        fields:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: GraphQL field below data; dots separate set levels.
              path:
                type: string
                description: Index path for filters, sorts and aggregations.
              label:
                type: string
              help:
                type: string
              input:
                type: string
              repeated:
                type: boolean
              required:
                type: boolean
              targets:
                type: array
                items:
                  type: string
                description: Content types, or name patterns, a selector accepts; absent means any.
            required: [name, path, input]
            additionalProperties: false
        appFields:
          type: array
          items:
            type: string
        appFieldsNote:
          type: string
        indexFields:
          type: object
          additionalProperties:
            type: string
        examples:
          type: array
          items:
            type: object
            properties:
              use:
                type: string
              query:
                type: string
            required: [use, query]
            additionalProperties: false
        truncated:
          type: boolean
        hint:
          type: string
      required: [project, branch]
      additionalProperties: false
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
